<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CallGuard · Allow microphone</title>
<style>
  body{margin:0;font:15px/1.55 system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f7f6;color:#16302d;display:grid;place-items:center;min-height:100vh}
  .card{background:#fff;border:1px solid #dbe6e3;border-radius:16px;padding:28px 30px;max-width:440px;box-shadow:0 8px 28px rgba(20,40,40,.08)}
  h1{font-size:19px;margin:0 0 8px} p{margin:0 0 14px;color:#3d5753}
  button{border:0;border-radius:10px;padding:10px 18px;background:#2f7f78;color:#fff;font:inherit;font-weight:600;cursor:pointer}
  .ok{color:#1f7a4d;font-weight:600} .bad{color:#b23a2e;font-weight:600}
</style></head>
<body>
<div class="card">
  <h1>Record your side of the call</h1>
  <p>For two-way calls CallGuard records the caller as Speaker 1 and your microphone as Speaker 2, so the transcript shows who said what. Chrome needs your OK once.</p>
  <p id="msg">Click <b>Allow</b> in Chrome's prompt.</p>
  <button id="again" type="button" hidden>Ask again</button>
</div>
<script src="mic.js"></script>
</body>
</html>
